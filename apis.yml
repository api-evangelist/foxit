aid: foxit

name: Foxit eSign

image: https://www.foxit.com/assets/images/og-images/thumb.webp

description: Foxit Software provides Foxit eSign, a solution that enables organizations to send, sign, and manage agreements through secure electronic
  signature workflows. The service is offered to businesses that need to handle legally binding signatures, integrate signing into document processes,
  and manage signed documents at scale. It is part of Foxit’s broader portfolio of PDF and document productivity tools.

